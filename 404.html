<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — sudoxs archive</title>

    <script>
        (function(){
            try{
                var saved = localStorage.getItem("sx-theme");
                if(saved === "light") document.documentElement.classList.add("theme-light");
            }catch(e){}
        })();
    </script>

    <style>
        :root {
            --bg: #070a08;
            --bg-deep: #040605;
            --surface: #0c100d;
            --surface-raised: #111611;
            --ink: #c2c8c1;
            --ink-dim: #7a837a;
            --ink-faint: #4a534b;
            --ink-bright: #e8ebe5;
            --danger: #a9252b;
            --danger-bright: #cf4a50;
            --danger-dark: #4d1518;
            --signal: #93a886;
            --border: #232a23;
            --border-strong: #3a423b;
            --ambient-1: rgba(74,91,65,.11);
            --ambient-2: rgba(126,23,29,.08);
            --ambient-3: #090d0a;
            --font-mono: "IBM Plex Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
            --font-display:"Franklin Gothic Condensed","Liberation Sans Narrow","Nimbus Sans Narrow",sans-serif;
        }
        html.theme-light {
            --bg: #f3f1ec;
            --bg-deep: #e8e5dd;
            --surface: #ffffff;
            --surface-raised: #f7f5f0;
            --ink: #2a2f2a;
            --ink-dim: #5a635a;
            --ink-faint: #8b938b;
            --ink-bright: #0d100d;
            --danger: #b8292f;
            --danger-bright: #c9363c;
            --danger-dark: #f0d5d6;
            --signal: #4f7040;
            --border: #d6d2c8;
            --border-strong: #b8b3a6;
            --ambient-1: rgba(74,91,65,.06);
            --ambient-2: rgba(126,23,29,.04);
            --ambient-3: #ebe8e0;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{font-size:15px;background:var(--bg-deep)}
        body{
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:radial-gradient(circle at 78% 12%,var(--ambient-1),transparent 27rem),
                       radial-gradient(circle at 13% 76%,var(--ambient-2),transparent 30rem),
                       linear-gradient(135deg,var(--bg-deep),var(--bg) 46%,var(--ambient-3));
            color:var(--ink);font-family:var(--font-mono);line-height:1.7;
            transition:background-color .3s ease,color .3s ease;
        }
        .theme-toggle-wrap{
            position:fixed;top:1rem;right:1rem;z-index:20;
        }
        /* ── Theme switch (Uiverse by MRez321) ── */
        .theme-switch { position: relative; display: flex; justify-content: center; direction: rtl; }
        #theme-checkbox { display: none; }
        #theme-checkbox + label {
          font-size: 1.35rem; height: 1em; width: 2.5em; border-radius: 0.25em;
          cursor: pointer; display: flex; justify-content: space-between;
          background-color: #cecece; position: relative; transition: background-color .3s ease;
        }
        #theme-checkbox:checked + label { background-color: #3a3a3a; }
        #theme-checkbox + label:active { transform: scale(0.85); transition: transform 0.2s; }
        #theme-checkbox + label div {
          width: 0.8em; height: 0.8em; border-radius: inherit;
          position: absolute; top: 0.1em; left: 0.1em; z-index: 10;
          transition: 0.5s cubic-bezier(1, 0.33, 0.11, 1.34);
          background-color: #f2f2f2;
        }
        #theme-checkbox:checked + label div { left: 1.6em; background-color: #212121; }
        #theme-checkbox + label span { display: flex; }
        #theme-checkbox + label svg { display: inline-block; height: 1em; width: 1em; padding: 0.15em; box-sizing: border-box; }
        #theme-checkbox + label span:first-of-type { color: #3a3a3a; }
        #theme-checkbox + label span:last-of-type { color: #cecece; }

        .container{
            position:relative;z-index:5;
            text-align:center;padding:2rem;
            border:1px solid var(--border-strong);
            background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 33%),rgba(9,13,10,.76);
            clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
            box-shadow:22px 22px rgba(0,0,0,.14);
            max-width:600px;width:90%;
        }
        html.theme-light .container{
            background:linear-gradient(135deg,rgba(0,0,0,.012),transparent 33%),var(--surface);
            box-shadow:22px 22px rgba(0,0,0,.06);
        }
        .err-code{
            font-family:var(--font-display);font-size:clamp(6rem,15vw,11rem);
            font-weight:900;color:var(--danger-bright);line-height:1;
            letter-spacing:-.04em;
        }
        h1{color:var(--ink-bright);font-family:var(--font-display);font-size:1.5rem;margin:1rem 0}
        p{color:var(--ink-dim);font-size:.8rem;margin-bottom:2rem;line-height:1.8}
        a{
            display:inline-flex;align-items:center;gap:.5rem;
            padding:.7rem 1.3rem;border:1px solid var(--danger-dark);
            background:rgba(88,16,20,.18);color:var(--ink-bright);
            font-size:.6rem;letter-spacing:.12em;text-decoration:none;
            transition:background 180ms ease,border-color 180ms ease;
        }
        html.theme-light a{background:rgba(184,41,47,.08);color:var(--ink-bright)}
        a:hover{border-color:var(--danger-bright);background:rgba(125,24,29,.28)}
        .footer-mark{color:var(--ink-faint);font-size:.5rem;letter-spacing:.15em;margin-top:1.5rem}
        ::selection{background:var(--danger-dark);color:var(--ink-bright)}

        .pyramid-bg{
            position:fixed;inset:0;z-index:0;
            display:flex;align-items:center;justify-content:center;
            pointer-events:none;overflow:hidden;opacity:.055;
            --pf: 62vmin;
        }
        html.theme-light .pyramid-bg{opacity:.06;filter:hue-rotate(-15deg) saturate(.7)}
        .pyramid-loader{position:relative;width:var(--pf);height:var(--pf);transform-style:preserve-3d;transform:rotateX(-20deg)}
        .pyramid-loader .wrapper{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:sx-pyr-spin 4s linear infinite}
        @keyframes sx-pyr-spin{100%{transform:rotateY(360deg)}}
        .pyramid-loader .side{
            width:calc(var(--pf) * .2333);height:calc(var(--pf) * .2333);
            position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;
            transform-origin:center top;clip-path:polygon(50% 0%,0% 100%,100% 100%);
        }
        .pyramid-loader .side1{transform:rotateZ(-30deg) rotateY(90deg);background:conic-gradient(#2BDEAC,#F028FD,#D8CCE6,#2F2585)}
        .pyramid-loader .side2{transform:rotateZ(30deg) rotateY(90deg);background:conic-gradient(#2F2585,#D8CCE6,#F028FD,#2BDEAC)}
        .pyramid-loader .side3{transform:rotateX(30deg);background:conic-gradient(#2F2585,#D8CCE6,#F028FD,#2BDEAC)}
        .pyramid-loader .side4{transform:rotateX(-30deg);background:conic-gradient(#2BDEAC,#F028FD,#D8CCE6,#2F2585)}
        .pyramid-loader .shadow{
            width:calc(var(--pf) * .2);height:calc(var(--pf) * .2);
            position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;
            transform:rotateX(90deg) translateZ(calc(var(--pf) * -.1333));
            filter:blur(12px);background:#8B5AD5;
        }
        @media(prefers-reduced-motion:reduce){ .pyramid-loader .wrapper{animation:none} }
    </style>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'&gt;&lt;rect fill='%230a0a0a' width='32' height='32' rx='2'/&gt;&lt;text x='16' y='22' text-anchor='middle' fill='%23cc0000' font-size='16' font-family='monospace'&gt;xs&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
    <div class="pyramid-bg" aria-hidden="true">
        <div class="pyramid-loader">
            <div class="wrapper">
                <span class="side side1"></span>
                <span class="side side2"></span>
                <span class="side side3"></span>
                <span class="side side4"></span>
                <span class="shadow"></span>
            </div>
        </div>
    </div>

    <div class="theme-toggle-wrap">
        <div class="theme-switch">
          <input type="checkbox" id="theme-checkbox" />
          <label for="theme-checkbox">
            <div></div>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd"></path>
              </svg>
            </span>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
              </svg>
            </span>
          </label>
        </div>
    </div>

    <div class="container">
        <div class="err-code">404</div>
        <h1>TARGET NOT FOUND</h1>
        <p>The requested resource does not exist in this archive.<br>It may have been moved, deleted, or never existed.</p>
        <a href="https://sudoxs.github.io/sudoxsweb/">← RETURN TO ROOT</a>
        <div class="footer-mark">[SUDOXS] — OFFENSIVE SECURITY ARCHIVE</div>
    </div>
    <script>
        (function(){
            var cb = document.getElementById("theme-checkbox");
            if(cb){
                cb.checked = document.documentElement.classList.contains("theme-light");
                cb.addEventListener("change", function(){
                    if(cb.checked){
                        document.documentElement.classList.add("theme-light");
                        try{ localStorage.setItem("sx-theme","light"); }catch(e){}
                    } else {
                        document.documentElement.classList.remove("theme-light");
                        try{ localStorage.setItem("sx-theme","dark"); }catch(e){}
                    }
                });
            }

            // Auto-redirect if this is a GitHub Pages 404 on a hash route
            const path = window.location.pathname;
            const hash = window.location.hash;
            if(hash && hash.startsWith("#/")){
                window.location.replace("/"+hash);
            }
            const parts = path.replace(/^\/|\/$/g,"").split("/");
            if(parts.length>=2 && parts[0]==="sudoxs_playbook"){
                const cat = parts[1];
                const file = parts.slice(2).join("/");
                if(file) window.location.replace("/#/file/"+cat+"/"+encodeURIComponent(file));
                else window.location.replace("/#/category/"+cat);
            }
        })();
    </script>
</body>
</html>
