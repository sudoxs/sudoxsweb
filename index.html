<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Offensive Security Technique Cookbook">
    <meta name="author" content="sudoxs">
    <title>sudoxs // offensive security cookbook</title>

    <style>
        /* ═══════════════════════ DESIGN TOKENS ═══════════════════════ */
        :root {
            --bg:          #070a08;
            --bg-deep:     #040605;
            --surface:     #0c100d;
            --surface-raised: #111611;
            --surface-active: #151b16;
            --ink:         #c2c8c1;
            --ink-dim:     #7a837a;
            --ink-faint:   #4a534b;
            --ink-bright:  #e8ebe5;
            --danger:      #a9252b;
            --danger-bright: #cf4a50;
            --danger-dark: #4d1518;
            --signal:      #93a886;
            --signal-bright: #b8c9ab;
            --amber:       #a88747;
            --border:      #232a23;
            --border-strong: #3a423b;
            --font-mono:   "IBM Plex Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
            --font-display:"Franklin Gothic Condensed","Liberation Sans Narrow","Nimbus Sans Narrow",sans-serif;
            --page-gap:    clamp(1rem, 3vw, 2.5rem);
            --content-max: 1400px;

            /* ── فونت‌های استاندارد و ریسپانسیو ── */
            --fs-3xs: clamp(0.62rem, 0.58rem + 0.2vw, 0.72rem);
            --fs-2xs: clamp(0.68rem, 0.64rem + 0.25vw, 0.78rem);
            --fs-xs:  clamp(0.74rem, 0.70rem + 0.3vw, 0.85rem);
            --fs-sm:  clamp(0.82rem, 0.78rem + 0.35vw, 0.95rem);
            --fs-md:  clamp(0.92rem, 0.88rem + 0.4vw, 1.05rem);
            --fs-lg:  clamp(1.05rem, 1rem + 0.6vw, 1.25rem);
            --fs-xl:  clamp(1.25rem, 1.1rem + 1vw, 1.6rem);
            --fs-2xl: clamp(1.6rem, 1.3rem + 2vw, 2.4rem);
        }

        /* ═══════════════════════ RESET ═══════════════════════ */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{font-size:16px;scroll-behavior:smooth;background:var(--bg-deep);overflow-x:hidden;width:100%}
        body{
            min-height:100vh;max-width:100%;overflow-x:hidden;
            background:radial-gradient(circle at 78% 12%,rgba(74,91,65,.11),transparent 27rem),
                       radial-gradient(circle at 13% 76%,rgba(126,23,29,8%),transparent 30rem),
                       linear-gradient(135deg,var(--bg-deep),var(--bg) 46%,#090d0a);
            color:var(--ink);font-family:var(--font-mono);line-height:1.7;
            -webkit-font-smoothing:antialiased;
        }
        a{color:inherit}
        a:focus-visible{outline:1px solid var(--danger-bright);outline-offset:5px}
        img,video,svg{display:block;max-width:100%}

        /* ═══════════════════════ AMBIENT FX ═══════════════════════ */
        .ambient-grid,.noise,.scanlines,.scan-beam{position:fixed;inset:0;pointer-events:none}
        .ambient-grid{
            z-index:0;opacity:.24;
            background-image:linear-gradient(rgba(132,150,122,.035) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(132,150,122,.035) 1px,transparent 1px);
            background-size:48px 48px;
        }
        .noise{
            z-index:1;opacity:.022;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size:180px 180px;
        }
        .scanlines{
            z-index:2;opacity:.04;
            background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
        }
        .scan-beam{
            z-index:3;opacity:.03;
            background:linear-gradient(180deg,transparent 0%,rgba(210,40,48,.12) 48%,transparent 100%);
            animation:scan-page 7s ease-in-out infinite;
        }

        /* ═══════════════════════ EDGE MARKS ═══════════════════════ */
        .edge-mark{
            position:fixed;z-index:4;top:50%;transform:translateY(-50%);
            color:var(--ink-faint);font-size:var(--fs-3xs);letter-spacing:.18em;
            writing-mode:vertical-rl;pointer-events:none;opacity:.45;
        }
        .edge-mark-left{left:.35rem}
        .edge-mark-right{right:.35rem}

        /* ═══════════════════════ CONTAINER ═══════════════════════ */
        .container{
            position:relative;z-index:5;
            width:min(100% - var(--page-gap)*2, var(--content-max));
            margin:0 auto;padding:1.4rem 0 3rem;
        }

        /* ═══════════════════════ HEADER ═══════════════════════ */
        .site-header{
            display:flex;align-items:center;justify-content:space-between;
            flex-wrap:wrap;gap:.8rem 1.5rem;
            padding:.7rem 0 1.1rem;margin-bottom:1.5rem;
            border-bottom:1px solid var(--border);
        }
        .brand-lockup{display:flex;align-items:center;gap:.8rem}
        .logo{
            color:var(--ink-bright);font-family:var(--font-display);
            font-size:var(--fs-lg);font-weight:900;letter-spacing:.13em;
            line-height:1;text-decoration:none;
        }
        .logo-bracket{color:var(--danger-bright)}
        .brand-code{
            padding-left:.8rem;border-left:1px solid var(--border-strong);
            color:var(--ink-dim);font-size:var(--fs-2xs);letter-spacing:.17em;
        }
        .header-controls{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap}
        .system-status{
            display:flex;align-items:center;gap:.48rem;
            color:var(--signal);font-size:var(--fs-2xs);letter-spacing:.12em;
        }
        .status-light{
            width:7px;height:7px;border-radius:50%;background:var(--signal);
            box-shadow:0 0 0 3px rgba(141,162,125,8%);
            animation:status-pulse 2.6s ease-in-out infinite;
        }
        .main-nav{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}

        /* ── nav link ── */
        .main-nav a,.nav-dropdown-trigger{
            position:relative;padding:.5rem .75rem;
            color:var(--ink-dim);font-size:var(--fs-xs);letter-spacing:.13em;
            text-decoration:none;text-transform:uppercase;cursor:pointer;
            transition:color 180ms ease,background 180ms ease;
            white-space:nowrap;
        }
        .main-nav a::before,.nav-dropdown-trigger::before{
            content:"";position:absolute;inset:auto 0 0;height:1px;
            background:var(--danger-bright);transform:scaleX(0);
            transform-origin:left;transition:transform 220ms ease;
        }
        .main-nav a:hover,.main-nav a.active,
        .nav-dropdown-trigger:hover,.nav-dropdown-trigger.active{
            color:var(--ink-bright);background:rgba(255,255,255,.018);
        }
        .main-nav a:hover::before,.main-nav a.active::before,
        .nav-dropdown-trigger:hover::before,.nav-dropdown-trigger.active::before{
            transform:scaleX(1);
        }

        /* ── dropdown ── */
        .nav-dropdown{position:relative;display:inline-flex}
        .nav-dropdown-trigger::after{content:" ▾";font-size:var(--fs-3xs)}
        .nav-dropdown-menu{
            display:none;position:absolute;top:100%;right:0;z-index:30;
            min-width:180px;padding:.3rem 0;
            border:1px solid var(--border-strong);
            background:var(--surface-raised);
            box-shadow:0 8px 24px rgba(0,0,0,.5);
        }
        .nav-dropdown.open .nav-dropdown-menu{display:block}
        .nav-dropdown-menu a{
            display:block;padding:.55rem 1rem;
            font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;
            text-decoration:none;color:var(--ink-dim);
            transition:background 150ms ease,color 150ms ease;
        }
        .nav-dropdown-menu a:hover{background:var(--surface-active);color:var(--ink-bright)}

        /* ═══════════════════════ HERO (PIP-BOY full width) ═══════════════════════ */
        .home-hero{
            position:relative;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:2rem;
            min-height:auto;
            padding:1rem 0 3rem;
            width:100%;
        }
        .home-hero::before{
            content:"SUDOXS";position:absolute;top:-1rem;left:50%;transform:translateX(-50%);
            color:rgba(255,255,255,.022);font-family:var(--font-display);
            font-size:clamp(6rem,16vw,14rem);font-weight:900;
            letter-spacing:-.08em;line-height:1;pointer-events:none;z-index:0;
        }
        .hero-copy{
            position:relative;z-index:2;
            display:flex;flex-direction:column;align-items:center;
            width:100%;
            max-width:100%;
        }
        .eyebrow{
            display:flex;justify-content:space-between;
            width:100%;max-width:900px;margin-bottom:1.5rem;
            padding:.55rem 0;border-top:1px solid var(--danger-dark);
            border-bottom:1px solid var(--border);
            color:var(--ink-dim);font-size:var(--fs-2xs);letter-spacing:.17em;
        }
        .hero-actions{
            display:flex;align-items:center;justify-content:center;
            gap:1.25rem;flex-wrap:wrap;margin-top:1.5rem;
        }
        .operator-id{color:var(--ink-faint);font-size:var(--fs-xs);letter-spacing:.13em}

        /* ═══════════════════════ STATS ROW ═══════════════════════ */
        .stats-row{
            display:grid;grid-template-columns:repeat(4,1fr);
            margin-top:1rem;border:1px solid var(--border);
            background:linear-gradient(rgba(255,255,255,.012),transparent 60%);
        }
        .stat-item{
            display:flex;flex-direction:column;gap:.35rem;
            padding:1.4rem 1.3rem;border-right:1px solid var(--border);
        }
        .stat-item:last-child{border-right:0}
        .stat-index{color:var(--ink-faint);font-size:var(--fs-3xs);letter-spacing:.14em}
        .stat-num{
            color:var(--danger-bright);font-family:var(--font-display);
            font-size:var(--fs-2xl);font-weight:900;line-height:1;
        }
        .stat-label{color:var(--ink-dim);font-size:var(--fs-2xs);letter-spacing:.08em;text-transform:uppercase}

        /* ═══════════════════════ BREADCRUMB ═══════════════════════ */
        .breadcrumb{
            display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
            color:var(--ink-dim);font-size:var(--fs-2xs);letter-spacing:.1em;
            margin-top:.6rem;padding:.5rem 0;
        }
        .breadcrumb a{
            color:var(--signal);text-decoration:none;
            transition:color 150ms ease;
        }
        .breadcrumb a:hover{color:var(--danger-bright)}
        .breadcrumb-sep{color:var(--ink-faint);font-size:var(--fs-3xs)}
        .breadcrumb-current{color:var(--ink-bright)}

        /* ═══════════════════════ ARCHIVE HEADING ═══════════════════════ */
        .archive-heading{
            display:flex;align-items:end;justify-content:space-between;
            gap:2rem;margin-bottom:1.75rem;padding-bottom:1rem;
            border-bottom:1px solid var(--border-strong);
        }
        .section-kicker{
            display:block;margin-bottom:.45rem;
            color:var(--danger-bright);font-size:var(--fs-2xs);letter-spacing:.2em;
        }
        .archive-heading h2{
            color:var(--ink-bright);font-family:var(--font-display);
            font-size:clamp(2.2rem,5vw,4.5rem);font-weight:900;
            letter-spacing:-.025em;line-height:.95;text-transform:uppercase;
            overflow-wrap:anywhere;word-break:break-word;
        }
        .record-count{color:var(--ink-faint);font-size:var(--fs-2xs);letter-spacing:.14em}

        /* ═══════════════════════ EXPLORER ═══════════════════════ */
        .explorer-wrap{margin-top:1rem}
        .explorer-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
            gap:1rem;
        }
        .explorer-item{
            position:relative;display:flex;align-items:center;gap:.85rem;
            padding:1.1rem 1.2rem;
            border:1px solid var(--border);
            background:linear-gradient(135deg,rgba(255,255,255,.018),transparent 45%),rgba(9,13,10,.74);
            color:var(--ink);text-decoration:none;
            transition:border-color 220ms ease,background 220ms ease,transform 220ms ease;
            cursor:pointer;overflow:hidden;
        }
        .explorer-item::before{
            content:"";position:absolute;inset:0 auto 0 0;width:2px;
            background:var(--danger-bright);transform:scaleY(0);
            transform-origin:bottom;transition:transform 280ms ease;
        }
        .explorer-item:hover{
            border-color:var(--border-strong);
            background-color:var(--surface-raised);
            transform:translateY(-3px);
        }
        .explorer-item:hover::before{transform:scaleY(1)}
        .explorer-item.folder{border-color:var(--border-strong);}
        .explorer-item.folder:hover{border-color:var(--signal);}
        .explorer-item.folder::before{background:var(--signal);}
        .explorer-icon{
            font-size:1.5rem;flex-shrink:0;width:2.2rem;text-align:center;
            filter:grayscale(.3);
            transition:filter 220ms ease,transform 220ms ease;
        }
        .explorer-item:hover .explorer-icon{filter:grayscale(0);transform:scale(1.1)}
        .explorer-info{flex:1;min-width:0}
        .explorer-name{
            display:block;color:var(--ink-bright);
            font-size:var(--fs-sm);letter-spacing:.04em;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .explorer-meta{
            display:block;color:var(--ink-faint);
            font-size:var(--fs-2xs);letter-spacing:.08em;margin-top:.25rem;
        }
        .explorer-arrow{
            color:var(--ink-faint);font-size:var(--fs-md);
            opacity:0;transform:translateX(-4px);
            transition:opacity 180ms ease,transform 180ms ease,color 180ms ease;
        }
        .explorer-item:hover .explorer-arrow{opacity:1;transform:translateX(0);color:var(--danger-bright)}

        /* ═══════════════════════ MARKDOWN CONTENT PAGE ═══════════════════════ */
        .md-content{
            max-width:900px;margin:0 auto;padding:2rem 0;
            color:var(--ink);line-height:1.85;font-size:var(--fs-md);
        }
        .md-content h1,.md-content h2,.md-content h3,.md-content h4{
            color:var(--ink-bright);font-family:var(--font-display);
            letter-spacing:.01em;margin:2rem 0 .8rem;
        }
        .md-content h1{font-size:var(--fs-2xl);border-bottom:1px solid var(--border-strong);padding-bottom:.5rem}
        .md-content h2{font-size:var(--fs-xl)}
        .md-content h3{font-size:var(--fs-lg)}
        .md-content p{margin-bottom:1rem}
        .md-content code{
            background:var(--surface-active);padding:.18rem .45rem;
            border-radius:3px;font-size:.9em;color:var(--signal-bright);
            border:1px solid var(--border);
        }
        .md-content pre{
            background:var(--surface);border:1px solid var(--border-strong);
            padding:1rem 1.2rem;overflow-x:auto;margin-bottom:1.2rem;
            font-size:var(--fs-sm);line-height:1.65;
        }
        .md-content pre code{background:none;border:0;padding:0;font-size:inherit}
        .md-content blockquote{
            border-left:2px solid var(--danger);padding:.4rem 1rem;
            margin:1rem 0;color:var(--ink-dim);background:rgba(255,255,255,.01);
        }
        .md-content ul,.md-content ol{padding-left:1.5rem;margin-bottom:1rem}
        .md-content li{margin-bottom:.35rem}
        .md-content a{color:var(--danger-bright);text-decoration:underline}
        .md-content table{
            display:block;width:100%;max-width:100%;
            overflow-x:auto;-webkit-overflow-scrolling:touch;
            border-collapse:collapse;margin-bottom:1.2rem;
        }
        .md-content th,.md-content td{
            border:1px solid var(--border);padding:.55rem .85rem;
            text-align:left;font-size:var(--fs-sm);
        }
        .md-content th{background:var(--surface);color:var(--ink-bright)}
        .md-content hr{border:0;border-top:1px solid var(--border);margin:2rem 0}
        .md-content img{max-width:100%;border:1px solid var(--border)}

        /* ═══════════════════════ 404 PAGE ═══════════════════════ */
        .page-404{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            min-height:60vh;text-align:center;gap:1.5rem;
        }
        .page-404 .err-code{
            font-family:var(--font-display);font-size:clamp(6rem,15vw,12rem);
            font-weight:900;color:var(--danger-bright);line-height:1;
            letter-spacing:-.04em;
        }
        .page-404 .err-msg{color:var(--ink-dim);font-size:var(--fs-md);max-width:520px}
        .page-404 .err-action{
            display:inline-flex;align-items:center;gap:.5rem;
            padding:.75rem 1.4rem;border:1px solid var(--danger-dark);
            background:rgba(88,16,20,.18);color:var(--ink-bright);
            font-size:var(--fs-xs);letter-spacing:.12em;text-decoration:none;
            cursor:pointer;transition:background 180ms ease,border-color 180ms ease;
        }
        .page-404 .err-action:hover{border-color:var(--danger-bright);background:rgba(125,24,29,.28)}

        /* ═══════════════════════ FOOTER ═══════════════════════ */
        .site-footer{margin-top:5rem;padding-top:1.5rem}
        .footer-divider{
            height:1px;margin-bottom:1.5rem;
            background:linear-gradient(90deg,var(--danger),var(--border) 35%,transparent);
        }
        .footer-grid{
            display:grid;grid-template-columns:1fr auto 1fr;
            align-items:center;gap:2rem;
        }
        .footer-identity{display:flex;flex-direction:column;gap:.3rem}
        .footer-mark{
            color:var(--ink-bright);font-family:var(--font-display);
            font-size:var(--fs-lg);font-weight:900;letter-spacing:.13em;
        }
        .footer-tagline{color:var(--ink-faint);font-size:var(--fs-2xs);letter-spacing:.12em;text-transform:uppercase}
        .footer-links{display:flex;align-items:center;justify-content:center;gap:1.1rem;flex-wrap:wrap}
        .footer-link{
            display:flex;align-items:center;gap:.55rem;
            color:var(--ink-dim);font-size:var(--fs-xs);letter-spacing:.1em;text-decoration:none;
            transition:color 200ms ease;
        }
        .footer-link:hover{color:var(--ink-bright)}
        .footer-system{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;color:var(--signal);font-size:var(--fs-xs);letter-spacing:.12em}

        /* ═══════════════════════ FOOTER LINK ICON FX ═══════════════════════ */
        .footer-icon-fx{
            position:relative;width:30px;height:30px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            border:1px solid var(--border-strong);background:rgba(255,255,255,.02);
            overflow:hidden;
            transition:border-color 220ms ease,transform 220ms ease,box-shadow 220ms ease;
        }
        .footer-icon-fx::before{
            content:"";position:absolute;width:200%;height:200%;
            background:radial-gradient(var(--clr,var(--signal)), transparent 68%);
            animation:sx-fx-move 1.8s linear infinite;
            opacity:.75;
            transition:opacity 260ms ease;
        }
        .footer-icon-fx::after{
            content:"";position:absolute;inset:2px;background:rgba(9,13,10,.92);
        }
        .footer-icon-fx svg{
            position:relative;z-index:2;width:14px;height:14px;
            color:var(--ink-dim);
            transition:color 220ms ease,filter 220ms ease;
        }
        .footer-link:hover .footer-icon-fx{
            border-color:var(--clr,var(--danger-bright));
            transform:translateY(-2px) scale(1.06);
            box-shadow:0 0 14px -2px var(--clr,var(--danger-bright));
        }
        .footer-link:hover .footer-icon-fx::before{opacity:1}
        .footer-link:hover .footer-icon-fx svg{
            color:var(--ink-bright);
            filter:drop-shadow(0 0 4px var(--clr,var(--danger-bright)));
        }
        @keyframes sx-fx-move{
            0%{transform:translate(-50%,-50%)}
            25%{transform:translate(0%,-50%)}
            50%{transform:translate(0%,0%)}
            75%{transform:translate(-50%,0%)}
            100%{transform:translate(-50%,-50%)}
        }

        /* ═══════════════════════ PIP-BOY WIDGET (FULL-WIDTH + NEON RED GLOW) ═══════════════════════ */
        .pipboy-wrapper {
          --pip-green: #d64a52;
          --pip-glow: rgba(214, 74, 82, 0.55);
          --bg-dark: #02100a;
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: "Courier New", Courier, monospace;
          text-transform: uppercase;
          width: 100%;
          max-width: 100%;
          padding: 0;
          box-sizing: border-box;
          container-type: inline-size;
          container-name: pipboy;
        }
        .pipboy-wrapper ::selection { background-color: var(--pip-green); color: var(--bg-dark); text-shadow: none; }
        .pipboy-wrapper input[type="radio"] { display: none; }

        /* ── شاسی: بدون حاشیه خاکستری، فقط ظرف شفاف ── */
        .pipboy-chassis {
          position: relative; width: 100%;
          background: transparent;
          padding: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          box-sizing: border-box;
        }
        .pipboy-wrapper .screw { display: none; }   /* پیچ‌های تزئینی حذف شدن چون شاسی حذف شده */

        /* ── CRT: بدون حاشیه مشکی، فقط نور نئونی قرمز از کنارها ── */
        .pipboy-wrapper .crt-screen {
          background-color: var(--bg-dark);
          border-radius: clamp(.8rem, 1.6vw, 1.5rem);
          position: relative; overflow: hidden;
          border: 0;
          box-shadow:
             0 0 10px 2px rgba(214, 74, 82, 0.70),
             0 0 24px 5px rgba(214, 74, 82, 0.50),
             0 0 50px 12px rgba(214, 74, 82, 0.30),
             0 0 100px 22px rgba(214, 74, 82, 0.15);
          aspect-ratio: 16/9;
          min-height: 380px;
          cursor: crosshair;
        }
        @media (min-width: 1100px){
          .pipboy-wrapper .crt-screen { aspect-ratio: 21/9; min-height: 420px; }
        }
        .pipboy-wrapper .screen-glass { position: absolute; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.20) 85%); }

    <!-- ═══════════════════════ MAIN ENGINE ═══════════════════════ -->
    <script>

    /* ─────────────────────────────────────────────
       SX — Offensive Security Cookbook Engine
       Static-site version: reads tree.json + local .md files
       No hardcoded paths — fully dynamic from tree.json
       ───────────────────────────────────────────── */
    const SX = (function(){

    // ═══════════════════════ STATE ═══════════════════════
    let tree        = null;
    let flatFiles   = [];
    let totalMd     = 0;

    // ═══════════════════════ ROUTER ═══════════════════════
    function getRoute(){
        const h = location.hash.replace(/^#/,"") || "/";
        const parts = h.split("/").filter(Boolean);
        if(!parts.length) return {page:"home"};

        if(parts[0]==="category" && parts.length > 1){
            const catPath = parts.slice(1).map(decodeURIComponent).join("/");
            return {page:"category", cat: catPath};
        }
        if(parts[0]==="file" && parts.length > 2){
            const file = decodeURIComponent(parts[parts.length-1]);
            const catPath = parts.slice(1, parts.length-1).map(decodeURIComponent).join("/");
            return {page:"file", cat: catPath, file};
        }
        return {page:"404"};
    }

    function navigate(hash){ location.hash = hash; }
    function encodePath(path){ return path.split("/").map(encodeURIComponent).join("/"); }

    // ═══════════════════════ DATA LOADING ═══════════════════════
    async function loadPlaybook(){
        try{
            const res = await fetch("tree.json");
            if(!res.ok) throw new Error("tree.json not found ("+res.status+")");
            tree = await res.json();
            console.log("SX: Loaded tree.json — "+tree.length+" top folders");
        }catch(e){
            console.error("SX: Could not load tree.json", e);
            tree = [];
        }
    }

    // ═══════════════════════ TREE HELPERS ═══════════════════════
    function findNodeByPath(path){
        if(!tree || !path) return null;
        const parts = path.split("/");
        for(const root of tree){
            if(root.name === parts[0]){
                return findInNode(root, parts.slice(1));
            }
        }
        return null;
    }

    function findInNode(node, parts){
        if(parts.length === 0) return node;
        if(node.type !== "dir" || !node.children) return null;
        const child = node.children.find(c => c.name === parts[0]);
        if(!child) return null;
        return findInNode(child, parts.slice(1));
    }

    function flattenTree(nodeList, parentPath){
        const out = [];
        for(const n of nodeList){
            const currentPath = parentPath ? parentPath + "/" + n.name : n.name;
            if(n.type === "file" && n.name.endsWith(".md")){
                out.push({ ...n, category: parentPath || "" });
            }
            if(n.type === "dir" && n.children){
                out.push(...flattenTree(n.children, currentPath));
            }
        }
        return out;
    }

    function getCategories(){
        if(!tree || !tree.length) return [];
        return tree.filter(n => n.type === "dir").map(n => n.name);
    }

    function hasData(){ return tree && tree.length > 0; }

    // ═══════════════════════ MD LAYOUT ═══════════════════════
    const MD_LAYOUT = Object.assign({
        useAltHeader:   false,
        useAltFooter:   false,
        bodyClass:      "viewing-md",
        beforeContent:  "",
        afterContent:   "",
        altHeaderHTML:  "",
        altFooterHTML:  "",
    }, window.SX_MD_LAYOUT || {});

    // ═══════════════════════ NAV ═══════════════════════
    function buildNav(categories){
        const nav  = document.getElementById("mainNav");
        const route = getRoute();
        const rootActive = (route.page === "home") ? " active" : "";
        let html = `<a href="#/" class="${rootActive}" onclick="SX.navigateHome();return false;">root</a>`;

        const cats = categories.length ? categories : [];

        if(cats.length){
            const visibleCount = cats.length > 5 ? 4 : cats.length;
            const visible = cats.slice(0, visibleCount);
            const overflow = cats.length > 5 ? cats.slice(visibleCount) : [];

            for(const c of visible){
                const active = (route.page === "category" && route.cat === c) ? " active" : "";
                html += `<a href="#/category/${encodeURIComponent(c)}" class="${active}">${escapeHTML(c)}</a>`;
            }

            if(overflow.length){
                const anyActive = (route.page === "category" && overflow.includes(route.cat.split("/")[0])) ? " active" : "";
                html += `<span class="nav-dropdown" id="navDropdown">`;
                html += `<span class="nav-dropdown-trigger${anyActive}" onclick="SX.toggleDropdown(event)">more</span>`;
                html += `<span class="nav-dropdown-menu">`;
                for(const c of overflow){
                    html += `<a href="#/category/${encodeURIComponent(c)}">${escapeHTML(c)}</a>`;
                }
                html += `</span></span>`;
            }
        }
        nav.innerHTML = html;
    }

    function toggleDropdown(e){
        e.stopPropagation();
        const dd = document.getElementById("navDropdown");
        if(dd) dd.classList.toggle("open");
    }
    document.addEventListener("click", ()=>{
        const dd = document.getElementById("navDropdown");
        if(dd) dd.classList.remove("open");
    });

    // ═══════════════════════ INV EXPLORER ═══════════════════════
    let invContentCache    = {};
    let invIndexingStarted = false;
    let invIndexingDone    = false;
    let invDebounceTimer   = null;

    function invHighlight(text, query){
        if(!query) return escapeHTML(text);
        const esc = escapeHTML(text);
        const q = escapeHTML(query);
        try{
            const re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
            return esc.replace(re, "<mark>$1</mark>");
        }catch(e){ return esc; }
    }

    function invFlattenFiles(nodes){
        let out = [];
        for(const n of (nodes || [])){
            if(n.type === "file") out.push(n);
            if(n.type === "dir" && n.children) out = out.concat(invFlattenFiles(n.children));
        }
        return out;
    }

    function invEnsureContentIndex(){
        if(invIndexingStarted) return;
        invIndexingStarted = true;
        const mdFiles = invFlattenFiles(tree).filter(f => /\.md$/i.test(f.name));
        const total = mdFiles.length;
        if(total === 0){ invIndexingDone = true; return; }

        let done = 0;
        const CONCURRENCY = 6;
        let cursor = 0;

        function worker(){
            return new Promise(resolve => {
                function next(){
                    if(cursor >= mdFiles.length){ resolve(); return; }
                    const f = mdFiles[cursor++];
                    const url = f.download_url || f.path;
                    fetch(url).then(r => r.ok ? r.text() : "").catch(() => "").then(txt => {
                        invContentCache[f.path] = (txt || "").toLowerCase();
                        done++;
                        const metaEl = document.getElementById("invResultMeta");
                        if(metaEl && !invIndexingDone) metaEl.textContent = `INDEXING ${done}/${total} FILES…`;
                        next();
                    });
                }
                next();
            });
        }

        const workers = [];
        for(let i=0;i<CONCURRENCY;i++) workers.push(worker());
        Promise.all(workers).then(() => {
            invIndexingDone = true;
            invRenderTree();
        });
    }

    function invFilterNode(node, nameQ, contentQ){
        if(node.type === "file"){
            const nameOK = !nameQ || node.name.toLowerCase().includes(nameQ);
            let contentOK = true;
            if(contentQ){
                const isMd = /\.md$/i.test(node.name);
                const cached = invContentCache[node.path];
                contentOK = isMd && typeof cached === "string" && cached.includes(contentQ);
            }
            return (nameOK && contentOK) ? Object.assign({}, node) : null;
        }
        const filteredChildren = [];
        for(const child of (node.children || [])){
            const fc = invFilterNode(child, nameQ, contentQ);
            if(fc) filteredChildren.push(fc);
        }
        const selfNameMatches = nameQ && node.name.toLowerCase().includes(nameQ) && !contentQ;
        if(filteredChildren.length === 0 && !selfNameMatches) return null;
        return Object.assign({}, node, { children: filteredChildren.length ? filteredChildren : (node.children || []) });
    }

    function invFilterTree(nameQ, contentQ){
        if(!nameQ && !contentQ) return tree || [];
        const out = [];
        for(const root of (tree || [])){
            const f = invFilterNode(root, nameQ, contentQ);
            if(f) out.push(f);
        }
        return out;
    }

    function invCountStats(nodes){
        let dirs = 0, files = 0;
        for(const n of nodes){
            if(n.type === "dir"){ dirs++; if(n.children){ const s = invCountStats(n.children); dirs += s.dirs; files += s.files; } }
            else files++;
        }
        return {dirs, files};
    }

    function invBuildNodeLi(node, catPath, forceOpen, nameQ, contentQ){
        const li = document.createElement("li");
        if(node.type === "dir"){

            }

    function invRenderTree(){
        const nameInput    = document.getElementById("invNameInput");
        const contentInput = document.getElementById("invContentInput");
        const treeRootEl   = document.getElementById("invTreeRoot");
        const metaEl       = document.getElementById("invResultMeta");
        if(!nameInput || !treeRootEl) return;

        const nameQ    = nameInput.value.trim().toLowerCase();
        const contentQ = contentInput ? contentInput.value.trim().toLowerCase() : "";
        const isSearching = !!(nameQ || contentQ);

        if(contentQ && invIndexingStarted && !invIndexingDone) return;

        const data = invFilterTree(nameQ, contentQ);
        treeRootEl.innerHTML = "";

        if(!data.length){
            const msg = (!tree || tree.length === 0) ? "Archive is empty." : `No matches${isSearching ? " for your search" : ""}.`;
            treeRootEl.innerHTML = `<div class="inv-empty">${msg}</div>`;
        } else {
            const ul = document.createElement("ul");
            ul.className = "inv-tree";
            data.forEach(n => ul.appendChild(invBuildNodeLi(n, "", isSearching, nameQ, contentQ)));
            treeRootEl.appendChild(ul);
        }

        if(metaEl){
            const stats = invCountStats(tree || []);
            const visStats = invCountStats(data);
            metaEl.textContent = isSearching
                ? `${visStats.files} FILE${visStats.files!==1?"S":""} · ${visStats.dirs} DIR${visStats.dirs!==1?"S":""} (OF ${stats.files})`
                : `${stats.files} FILE${stats.files!==1?"S":""} · ${stats.dirs} DIR${stats.dirs!==1?"S":""} TOTAL`;
        }
    }

        clearTimeout(invDebounceTimer);
        invDebounceTimer = setTimeout(invRenderTree, 90);
    }

        });
        contentClear.addEventListener("click", () => {
            contentInput.value = ""; contentBox.classList.remove("has-value"); invRenderTree();
        });

        invRenderTree();
    }

    // ═══════════════════════ UTILS ═══════════════════════
    function escapeHTML(str){
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    function truncateText(text, max){
        if(text.length <= max) return text;

    }

    /* ── Simple Markdown → HTML parser (no external deps) ── */
    function simpleMarkdown(md){
        let html = md;

        // ── Phase 1: stash code blocks and inline code with NUL-delimited tokens
        //    Using \u0000 ensures no interference from any markdown regex.
        const stash = [];
        function put(htmlFragment){
            const token = "\u0000STASH" + stash.length + "\u0000";
            stash.push(htmlFragment);
            return token;
        }

        // Fenced code blocks (```lang ... ```)
        html = html.replace(/```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g, function(_, lang, code){
            const cls = lang ? ` class="language-${lang}"` : "";
            return put("<pre><code" + cls + ">" + escapeHTML(code.replace(/\n$/, "")) + "</code></pre>");
        });

        // Inline code (`...`)
        html = html.replace(/`([^`\n]+)`/g, function(_, code){
            return put("<code>" + escapeHTML(code) + "</code>");
        });

        // ── Phase 2: HTML-escape the rest of the document
        html = html.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;");

        // ── Phase 3: block-level markdown ──

        // Fenced code blocks already stashed; nothing else to do here.

        // Blockquotes — handle line-by-line so multi-line quotes merge
        html = html.replace(/^(?:&gt;\s?.*(?:\n|$))+/gm, function(block){
            const inner = block.replace(/^&gt;\s?/gm, "").replace(/\n+$/,"");
            return "<blockquote>" + inner + "</blockquote>\n";
        });

        // Headings
        html = html.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
        html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
        html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
        html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");

        // Horizontal rules
        html = html.replace(/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/gm, "<hr>");

        // Tables (GitHub-flavoured)
        html = html.replace(/^\|(.+)\|\s*$/gm, function(row){
            const cells = row.split("|").slice(1, -1).map(c => c.trim());
            if(cells.every(c => /^:?-+:?$/.test(c))) return "\u0001TBLSEP\u0001";
            return "<tr>" + cells.map(c => "<td>" + c + "</td>").join("") + "</tr>";
        });
        html = html.replace(/((?:<tr>.*<\/tr>\n?\u0001TBLSEP\u0001\n?)|(?:<tr>.*<\/tr>\n?))/g, function(block){
            // Extract header row if separator was present
            const hasSep = block.indexOf("\u0001TBLSEP\u0001") !== -1;
            const rows = block.replace(/\u0001TBLSEP\u0001\n?/g, "").split("\n").filter(Boolean);
            if(!rows.length) return "";
            let out = "<table>";
            if(hasSep){
                const headerRow = rows.shift().replace(/<td>/g, "<th>").replace(/<\/td>/g, "</th>");
                out += headerRow;
            }
            out += rows.join("") + "</table>";
            return out;
        });

        // Lists — convert line-by-line, then wrap runs
        const lines = html.split("\n");
        const processed = [];
        for(let i = 0; i < lines.length; i++){
            const line = lines[i];
            const ulMatch = line.match(/^(\s*)[-*+]\s+(.+)$/);
            const olMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);
            if(ulMatch){
                processed.push("<li>" + ulMatch[2] + "</li>");
            } else if(olMatch){
                processed.push("<li>" + olMatch[2] + "</li>");
            } else {
                processed.push(line);
            }
        }
        html = processed.join("\n");

        // Wrap consecutive <li> in <ul>
        html = html.replace(/(?:^[ \t]*<li>.*<\/li>[ \t]*\n?)+/gm, function(block){
            const items = block.match(/<li>.*?<\/li>/g) || [];
            return "<ul>" + items.join("") + "</ul>\n";
        });

        // ── Phase 4: inline formatting (only on non-block content) ──

        // Bold & italic (order matters)
        html = html.replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>");
        html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
        html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        html = html.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");

        // Links & images (must not be inside code — already stashed)
        html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
        html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

        // ── Phase 5: wrap remaining plain text in <p> ──
        const finalLines = html.split("\n");
        const out = [];
        let buf = [];
        const blockRE = /^\s*<(?:h[1-4]|pre|ul|ol|li|table|thead|tbody|tr|th|td|hr|blockquote|div|p|img)\b/;
        function flush(){
            if(buf.length){
                const text = buf.join("\n").trim();
                if(text) out.push("<p>" + text + "</p>");
                buf = [];
            }
        }
        for(const line of finalLines){
            if(line.trim() === ""){
                flush();
                continue;
            }
            if(blockRE.test(line)){
                flush();
                out.push(line);
            } else {
                buf.push(line);
            }
        }
        flush();
        html = out.join("\n");

        // ── Phase 6: restore stashed code blocks / inline code ──
        html = html.replace(/\u0000STASH(\d+)\u0000/g, function(_, n){
            return stash[parseInt(n, 10)];
        });

        return html;
    }

    // ═══════════════════════ INIT ═══════════════════════
    async function init(){
        try{ await loadPlaybook(); }catch(e){ console.error("SX init error:", e); tree = []; }

        if(tree && tree.length){
            flatFiles = flattenTree(tree, null);
            totalMd   = flatFiles.length;
        }

        const route = getRoute();
        if(route.page === "home")         renderHome();
        else if(route.page === "category") renderCategory(route.cat);
        else if(route.page === "file")     await renderFile(route.cat, route.file);
        else                            render404();

        if(route.page !== "home") buildNav(getCategories());
    }

    function handleHashChange(){
        const route = getRoute();
        if(route.page === "home")         renderHome();
        else if(route.page === "category") renderCategory(route.cat);
        else if(route.page === "file")     renderFile(route.cat, route.file);
        else                            render404();
    }

    window.addEventListener("hashchange", handleHashChange);
    window.addEventListener("DOMContentLoaded", init);

    // ═══════════════════════ PUBLIC API ═══════════════════════
    return {
        navigateHome:   () => { navigate("/"); },
        navigateCategory: (path) => { navigate("/category/" + encodePath(path)); },
        navigateFile:   (cat, file) => { navigate("/file/" + encodePath(cat) + "/" + encodeURIComponent(file)); },
        toggleDropdown: toggleDropdown,
        getStats:       () => ({ totalMd, flatFiles, categories: getCategories() }),
        refresh:        async () => { await init(); },
    };

    })();
    </script>
